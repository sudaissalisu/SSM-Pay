# =============================================================================
# SSM-Pay Payment Platform - Grafana Dashboard Provisioning
# =============================================================================
# Automatic dashboard configuration for Grafana.
# This file defines how dashboards are loaded and managed.
#
# Documentation: https://grafana.com/docs/grafana/latest/administration/provisioning/
# =============================================================================

# API Version for provisioning configuration
apiVersion: 1

# List of dashboard providers
providers:
  # ---------------------------------------------------------------------------
  # Primary Dashboard Provider - Local JSON Files
  # ---------------------------------------------------------------------------
  - name: 'SSM-Pay Dashboards'
    orgId: 1
    folder: 'SSM-Pay'
    folderUid: 'ssm-pay-folder'
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true

  # ---------------------------------------------------------------------------
  # Optional: Additional Provider for Community Dashboards
  # Uncomment to enable community dashboard imports
  # ---------------------------------------------------------------------------
  # - name: 'Community Dashboards'
  #   orgId: 1
  #   folder: 'Community'
  #   type: file
  #   disableDeletion: false
  #   editable: true
  #   updateIntervalSeconds: 60
  #   options:
  #     path: /var/lib/grafana/community-dashboards

  # ---------------------------------------------------------------------------
  # Optional: Grafana.com Dashboard Sync
  # Uncomment to sync dashboards from grafana.com
  # ---------------------------------------------------------------------------
  # - name: 'Grafana.com'
  #   orgId: 1
  #   folder: 'Imported'
  #   type: grafana.com
  #   disableDeletion: true
  #   editable: false
  #   allowUiUpdates: false
  #   options:
  #     # Comma-separated list of dashboard IDs/Slugs to import
  #     dashboards:
  #       - id: 1860  # Node Exporter Full
  #       - revision: 1
  #       - datasource: Prometheus
  #       - id: 761   # Redis Dashboard
  #       - revision: 3
  #       - datasource: Prometheus
  #       - id: 9628  # PostgreSQL Dashboard
  #       - revision: 2
  #       - datasource: PostgreSQL
