# =============================================================================
# SSM-Pay Payment Platform - Kubernetes Deployment
# =============================================================================
# Production-ready Kubernetes deployment configuration for:
# - Next.js Application with horizontal scaling
# - Resource limits and requests
# - Health checks (liveness, readiness, startup)
# - Rolling update strategy
# - Pod anti-affinity for high availability
#
# Usage:
#   kubectl apply -f deployment.yaml
#   kubectl rollout status deployment/ssm-pay-app
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssm-pay-app
  namespace: default
  labels:
    app: ssm-pay
    component: application
    version: v1
    team: platform
    environment: production
  annotations:
    description: "SSM-Pay Payment Platform - Next.js Application"
    deployment.kubernetes.io/revision: "1"
spec:
  # Number of desired replicas (adjust based on load)
  replicas: 3
  
  # Label selector for pods managed by this deployment
  selector:
    matchLabels:
      app: ssm-pay
      component: application
  
  # Rolling update strategy for zero-downtime deployments
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Maximum number of pods that can be created above desired count
      maxSurge: 1
      # Maximum number of pods that can be unavailable during update
      maxUnavailable: 0
  
  # Pod template specification
  template:
    metadata:
      labels:
        app: ssm-pay
        component: application
        version: v1
        team: platform
        environment: production
      annotations:
        # Force pod restart when configmap changes
        configmap.reloader.stakater.com/reload: "ssm-pay-config"
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/api/metrics"
    
    spec:
      # Service account for the application
      serviceAccountName: default
      
      # Security context at pod level
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      
      # Pod termination grace period
      terminationGracePeriodSeconds: 60
      
      # Container specifications
      containers:
        # -------------------------------------------------------------------
        # Main Application Container
        # -------------------------------------------------------------------
        - name: app
          image: ssm-pay-app:latest
          imagePullPolicy: Always
          
          # Container ports
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
            - name: metrics
              containerPort: 9091
              protocol: TCP
          
          # Environment variables from ConfigMap and Secrets
          envFrom:
            - configMapRef:
                name: ssm-pay-config
            - secretRef:
                name: ssm-pay-secrets
                optional: true
          env:
            # Override specific values if needed
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
          
          # Resource limits and requests
          resources:
            requests:
              cpu: "250m"       # 0.25 CPU cores minimum
              memory: "512Mi"   # 512MB memory minimum
            limits:
              cpu: "2000m"      # 2 CPU cores maximum
              memory: "2Gi"     # 2GB memory maximum
          
          # Startup probe - waits for app to initialize
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30  # Total: 150 seconds max startup time
            timeoutSeconds: 5
          
          # Liveness probe - restarts container if unhealthy
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          
          # Readiness probe - removes from service if not ready
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          
          # Container security context
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          
          # Volume mounts
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /.next/cache
      
      # -----------------------------------------------------------------------
      # Volumes
      # -----------------------------------------------------------------------
      volumes:
        # Persistent storage for user uploads
        - name: uploads
          persistentVolumeClaim:
            claimName: ssm-pay-uploads-pvc
        
        # Temporary directory (writable)
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        
        # Cache directory (writable)
        - name: cache
          emptyDir:
            sizeLimit: 512Mi
      
      # -----------------------------------------------------------------------
      # Affinity Rules
      # -----------------------------------------------------------------------
      affinity:
        # Spread pods across nodes for HA
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: ssm-pay
                    component: application
                topologyKey: kubernetes.io/hostname
        
        # Node affinity (optional - schedule on specific node types)
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              preference:
                matchExpressions:
                  - key: node-type
                    operator: In
                    values:
                      - application
      
      # -----------------------------------------------------------------------
      # Tolerations (if using dedicated node pools)
      # -----------------------------------------------------------------------
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "ssm-pay"
          effect: "NoSchedule"
      
      # -----------------------------------------------------------------------
      # Topology Spread Constraints
      # -----------------------------------------------------------------------
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: ssm-pay
              component: application
      
      # -----------------------------------------------------------------------
      # Init Containers (optional)
      # -----------------------------------------------------------------------
      # initContainers:
      #   - name: check-db
      #     image: postgres:16-alpine
      #     command: ['sh', '-c', 'until pg_isready -h $DATABASE_HOST -p 5432; do echo waiting for database; sleep 2; done']
      
      # -----------------------------------------------------------------------
      # DNS Configuration
      # -----------------------------------------------------------------------
      dnsPolicy: ClusterFirst
      dnsConfig:
        searches:
          - ssm-pay.svc.cluster.local
          - svc.cluster.local
          - cluster.local
        options:
          - name: ndots
            value: "2"

# =============================================================================
# HorizontalPodAutoscaler (HPA) Configuration
# Uncomment to enable auto-scaling based on CPU/Memory
# =============================================================================
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ssm-pay-app-hpa
  labels:
    app: ssm-pay
    component: hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ssm-pay-app
  minReplicas: 2
  maxReplicas: 10
  metrics:
    # Scale based on CPU utilization
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    
    # Scale based on memory utilization
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    
    # Custom metric scaling (requires Prometheus Adapter)
    # - type: Pods
    #   pods:
    #     metric:
    #       name: http_requests_per_second
    #     target:
    #       type: AverageValue
    #       averageValue: 1000
  
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 4
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
        - type: Pods
          value: 1
          periodSeconds: 60
      selectPolicy: Min

# =============================================================================
# PodDisruptionBudget (PDB)
# Ensures minimum available pods during voluntary disruptions
# =============================================================================
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ssm-pay-app-pdb
  labels:
    app: ssm-pay
    component: pdb
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: ssm-pay
      component: application
