name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'

jobs:
  # Main CI job - runs lint, typecheck, and tests
  ci:
    name: Lint, TypeCheck & Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run typecheck

      - name: Run tests with coverage
        run: npm run test
        env:
          CI: true
          ZAINPAY_PUBLIC_KEY: ${{ secrets.ZAINPAY_PUBLIC_KEY || 'test_key' }}
          ZAINBOX_CODE_NAME: ${{ secrets.ZAINBOX_CODE_NAME || 'test_code' }}

      - name: Upload coverage report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # Build job - ensures the application builds successfully
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_ZAINPAY_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_ZAINPAY_PUBLIC_KEY || 'test_key' }}
          NEXT_PUBLIC_ZAINBOX_CODE_NAME: ${{ secrets.NEXT_PUBLIC_ZAINBOX_CODE_NAME || 'test_code' }}
          NODE_ENV: production

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next/
          retention-days: 3
