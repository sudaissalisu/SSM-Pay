# =============================================================================
# SSM-Pay CI/CD Pipeline
# =============================================================================
# Comprehensive continuous integration pipeline for enterprise payment platform
# Includes: linting, type checking, testing, security audit, and build stages
# =============================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, 'release/*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip test execution'
        required: false
        default: 'false'
        type: boolean

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Environment variables shared across all jobs
env:
  NODE_VERSION: '20'
  BUN_VERSION: '1.0.30'
  CI: true
  NEXT_TELEMETRY_DISABLED: '1'
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  # =============================================================================
  # Job 1: Code Linting
  # =============================================================================
  lint:
    name: 🔍 Lint Code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup Bun Runtime
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🔧 Enable Corepack & Setup Bun
        run: |
          corepack enable
          corepack prepare bun@${{ env.BUN_VERSION }} --activate
          bun --version

      - name: 💾 Cache Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            .next/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: 📥 Install Dependencies
        run: bun install --frozen-lockfile || bun install

      - name: 🔍 Run ESLint
        run: bun run lint --max-warnings=0
        continue-on-error: false

      - name: 🔍 Run Prettier Check (if available)
        run: bun run format:check || echo "No format:check script found"
        continue-on-error: true

  # =============================================================================
  # Job 2: Type Checking
  # =============================================================================
  typecheck:
    name: 📝 Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🔧 Enable Corepack & Setup Bun
        run: |
          corepack enable
          corepack prepare bun@${{ env.BUN_VERSION }} --activate

      - name: 💾 Cache Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-tsc-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: 📥 Install Dependencies
        run: bun install --frozen-lockfile || bun install

      - name: 📝 Run TypeScript Compiler
        run: npx tsc --noEmit --pretty
        env:
          NEXT_PUBLIC_APP_NAME: SSM-Pay CI

  # =============================================================================
  # Job 3: Unit & Integration Tests
  # =============================================================================
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🔧 Enable Corepack & Setup Bun
        run: |
          corepack enable
          corepack prepare bun@${{ env.BUN_VERSION }} --activate

      - name: 💾 Cache Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-test-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: 📥 Install Dependencies
        run: bun install --frozen-lockfile || bun install

      - name: 🧪 Execute Tests with Coverage
        if: ${{ github.event.inputs.skip_tests != 'true' }}
        run: bun run test:coverage --ci --coverage --reporters=default --reporters=junit
        env:
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          DATABASE_URL=file:./test.db

      - name: 📊 Upload Coverage Report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: 📊 Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: junit.xml
          retention-days: 7
        continue-on-error: true

      - name: 📈 Coverage Threshold Check
        if: success()
        run: |
          echo "Checking coverage thresholds..."
          # Add coverage threshold validation here if needed
          bun run test:coverage || exit 1

  # =============================================================================
  # Job 4: Security Audit
  # =============================================================================
  audit:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🔧 Enable Corepack & Setup Bun
        run: |
          corepack enable
          corepack prepare bun@${{ env.BUN_VERSION }} --activate

      - name: 📥 Install Dependencies
        run: bun install --frozen-lockfile || bun install

      - name: 🔒 Run npm Audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: 🔒 Run Bun Audit
        run: bun audit
        continue-on-error: true

      - name: 🔍 Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD

  # =============================================================================
  # Job 5: Build Application
  # =============================================================================
  build:
    name: 🏗️ Build Application
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    timeout-minutes: 20
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🔧 Enable Corepack & Setup Bun
        run: |
          corepack enable
          corepack prepare bun@${{ env.BUN_VERSION }} --activate

      - name: 💾 Cache Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            .next/cache
          key: ${{ runner.os }}-bun-build-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: 📥 Install Dependencies
        run: bun install --frozen-lockfile || bun install

      - name: 🏗️ Build Next.js Application
        run: bun run build
        env:
          NEXT_PUBLIC_APP_NAME: SSM-Pay
          NEXT_PUBLIC_APP_URL: https://ssmpay.com
          NODE_ENV: production
          ANALYZE: ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}

      - name: 📦 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            .next/
            public/
          retention-days: 7

      - name: 🐳 Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/ssmpay
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=

  # =============================================================================
  # Job 6: Docker Build & Push (Main Branch Only)
  # =============================================================================
  docker:
    name: 🐳 Docker Build & Push
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔑 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/ssmpay
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=

      - name: 📦 Cache Docker Layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: 🐳 Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
          platforms: linux/amd64,linux/arm64
          build-args: |
            NEXT_PUBLIC_APP_NAME=SSM-Pay
            NODE_ENV=production

      - name: 🔄 Update Cache (Minimize Space)
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache 2>/dev/null || true

  # =============================================================================
  # Job 7: Deploy to Staging (Develop Branch)
  # =============================================================================
  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment: staging
    timeout-minutes: 15
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🚀 Deploy to Staging Server
        run: |
          echo "🚀 Deploying to staging environment..."
          # Add deployment commands here
          # Example: ssh deploy@staging.ssmpay.com './deploy.sh'

      - name: ✅ Notify Deployment Success
        if: success()
        run: |
          echo "✅ Deployment to staging successful!"

      - name: ❌ Notify Deployment Failure
        if: failure()
        run: |
          echo "❌ Deployment to staging failed!"

  # =============================================================================
  # Job 8: Notification
  # =============================================================================
  notify:
    name: 📬 Send Notifications
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, audit, build]
    if: always()
    timeout-minutes: 5
    
    steps:
      - name: 📬 Determine Status
        id: status
        run: |
          if [ "${{ needs.lint.result }}" == "success" ] && \
             [ "${{ needs.typecheck.result }}" == "success" ] && \
             [ "${{ needs.test.result }}" == "success" ] && \
             [ "${{ needs.audit.result }}" == "success" ] && \
             [ "${{ needs.build.result }}" == "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
          fi

      - name: 📬 Slack Notification
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{
              "text": "SSM-Pay CI Pipeline ${{ steps.status.outputs.status }}",
              "attachments": [{
                "color": "${{ steps.status.outputs.status == 'success' && 'good' || 'danger' }}",
                "fields": [
                  {"title": "Repository", "value": "${{ github.repository }}", "short": true},
                  {"title": "Branch", "value": "${{ github.ref_name }}", "short": true},
                  {"title": "Commit", "value": "${{ github.sha }}", "short": true},
                  {"title": "Actor", "value": "${{ github.actor }}", "short": true}
                ]
              }]
            }' \
            $SLACK_WEBHOOK_URL || true
