# =============================================================================
# SSM-Pay Payment Platform - Nginx Reverse Proxy Configuration
# =============================================================================
# Production-ready Nginx configuration for:
# - SSL/TLS termination
# - HTTP/2 and HTTP/3 support
# - Rate limiting and DDoS protection
# - Caching headers optimization
# - WebSocket proxying
# - Security headers
# - Gzip compression
#
# This configuration is optimized for payment platform requirements
# with PCI-DSS compliance considerations.
# =============================================================================

# -----------------------------------------------------------------------------
# Main Nginx Configuration
# -----------------------------------------------------------------------------
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# Worker connections
events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    # -------------------------------------------------------------------------
    # Basic Settings
    # -------------------------------------------------------------------------
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Logging format with request ID for tracing
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time" '
                    'rid="$http_x_request_id"';
    
    # JSON logging format for log aggregation (ELK, etc.)
    format_log_json escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"remote_user":"$remote_user",'
        '"request":"$request",'
        '"status": $status,'
        '"body_bytes_sent": $body_bytes_sent,'
        '"request_time": $request_time,'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_forwarded_for":"$http_x_forwarded_for",'
        '"request_id":"$http_x_request_id",'
        '"upstream_response_time":"$upstream_response_time"'
    '}';
    
    access_log /var/log/nginx/access.log main;
    
    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    
    # Hide Nginx version for security
    server_tokens off;
    
    # Client body size limits (important for file uploads)
    client_max_body_size 50m;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;
    
    # Timeouts
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 30s;
    keepalive_requests 1000;

    # -------------------------------------------------------------------------
    # Gzip Compression
    # -------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/atom+xml
        image/svg+xml
        font/opentype
        font/ttf
        font/woff
        font/woff2;

    # -------------------------------------------------------------------------
    # Rate Limiting Zones
    # -------------------------------------------------------------------------
    # General rate limiting zone (based on client IP)
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=100r/s;
    
    # API rate limiting (stricter)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;
    
    # Auth endpoint rate limiting (very strict)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
    
    # Payment endpoint rate limiting
    limit_req_zone $binary_remote_addr zone=payment_limit:10m rate=20r/s;
    
    # Connection limiting zone
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # -------------------------------------------------------------------------
    # Upstream Definition (Next.js Application)
    # -------------------------------------------------------------------------
    upstream ssm_pay_app {
        least_conn;
        
        # App servers (update based on your deployment)
        server app:3000 weight=5 max_fails=3 fail_timeout=30s;
        # server app-2:3000 weight=5 max_fails=3 fail_timeout=30s;
        # server app-3:3000 weight=3 max_fails=3 fail_timeout=30s;
        
        # Keepalive connections to upstream
        keepalive 32;
    }

    # -------------------------------------------------------------------------
    # SSL/TLS Global Configuration
    # -------------------------------------------------------------------------
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    
    # Modern SSL configuration (TLS 1.2 and 1.3 only)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    
    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/nginx/ssl/chain.pem;
    
    # Resolver for OCSP stapling
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # -------------------------------------------------------------------------
    # Default Server (catch-all - rejects unknown hosts)
    # -------------------------------------------------------------------------
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        listen 443 ssl http2 default_server;
        listen [::]:443 ssl http2 default_server;
        server_name _;
        
        # Return 444 (close connection) for unknown hosts
        return 444;
    }

    # -------------------------------------------------------------------------
    # HTTP -> HTTPS Redirect Server
    # -------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name ssm-pay.com www.ssm-pay.com api.ssm-pay.com *.ssm-pay.com;
        
        # Health check endpoint (no redirect)
        location /health {
            access_log off;
            return 200 "OK";
            add_header Content-Type text/plain;
        }
        
        # Redirect all other traffic to HTTPS
        return 301 https://$host$request_uri;
    }

    # -------------------------------------------------------------------------
    # Main HTTPS Server - SSM-Pay Application
    # -------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        # HTTP/3 (QUIC) - requires nginx with QUIC support
        # listen 443 quic reuseport;
        # add_header Alt-Svc 'h3=":443"; ma=86400';
        
        server_name ssm-pay.com www.ssm-pay.com api.ssm-pay.com;
        
        # SSL certificates
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        
        # Document root (for static files if needed)
        root /usr/share/nginx/html;
        index index.html index.htm;

        # ---------------------------------------------------------------------
        # Security Headers
        # ---------------------------------------------------------------------
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        # CSP header (adjust based on your needs)
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://api.zainpay.ng; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        
        # Pass request ID from upstream or generate new one
        add_header X-Request-ID $request_id always;
        
        # CORS headers for API endpoints
        add_header Access-Control-Allow-Origin "$http_origin" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, X-Request-ID, X-Correlation-ID" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Max-Age "3600" always;

        # ---------------------------------------------------------------------
        # Request ID Generation
        # ---------------------------------------------------------------------
        set $request_id $http_x_request_id;
        if ($request_id = "") {
            set $request_id $request_id;
        }
        # Use ngx_http_userid_module or mgenerate module for UUID generation
        # For now, using $connection-$connection_requests as fallback
        
        # ---------------------------------------------------------------------
        # Connection Limits
        # ---------------------------------------------------------------------
        limit_conn conn_limit 20;

        # ---------------------------------------------------------------------
        # Location Blocks
        # ---------------------------------------------------------------------
        
        # Health check endpoint (no rate limiting)
        location = /health {
            access_log off;
            return 200 "OK";
            add_header Content-Type text/plain;
            add_header X-Request-ID $request_id;
        }
        
        # Prometheus metrics endpoint (restrict access)
        location = /metrics {
            # Allow only from internal networks or Prometheus server
            allow 172.16.0.0/12;
            allow 10.0.0.0/8;
            allow 127.0.0.1;
            deny all;
            
            proxy_pass http://ssm_pay_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }
        
        # Authentication endpoints (strict rate limiting)
        location ^~ /api/auth {
            limit_req zone=auth_limit burst=5 nodelay;
            limit_req_status 429;
            
            proxy_pass http://ssm_pay_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection "";
            
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
        
        # Payment API endpoints (moderate rate limiting)
        location ^~ /api/payment {
            limit_req zone=payment_limit burst=10 nodelay;
            limit_req_status 429;
            
            proxy_pass http://ssm_pay_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection "";
            
            # Longer timeouts for payment processing
            proxy_connect_timeout 120s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }
        
        # Webhook endpoints (from ZainPay) - no rate limiting for incoming
        location ^~ /api/webhooks {
            # No rate limiting - external services need reliable delivery
            
            proxy_pass http://ssm_pay_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            
            # Verify webhook signature in application layer
            proxy_pass_request_headers on;
        }
        
        # General API endpoints
        location ^~ /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;
            
            proxy_pass http://ssm_pay_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection "";
            
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
        
        # Next.js static assets with aggressive caching
        location /_next/static {
            expires 365d;
            add_header Cache-Control "public, immutable";
            access_log off;
            
            proxy_pass http://ssm_pay_app;
            proxy_set_header Host $host;
        }
        
        # Static assets caching
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
            access_log off;
            
            proxy_pass http://ssm_pay_app;
            proxy_set_header Host $host;
        }
        
        # Robots.txt
        location = /robots.txt {
            access_log off;
            log_not_found off;
            try_files $uri =404;
        }
        
        # Favicon
        location = /favicon.ico {
            access_log off;
            log_not_found off;
            try_files $uri =404;
        }
        
        # -----------------------------------------------------------------
        # WebSocket Support (for real-time features)
        # -----------------------------------------------------------------
        location /socket.io/ {
            proxy_pass http://ssm_pay_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            
            # WebSocket timeout settings
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
        
        # -----------------------------------------------------------------
        # Next.js Pages (with SSR caching headers)
        # -----------------------------------------------------------------
        location / {
            limit_req zone=general_limit burst=50 nodelay;
            limit_req_status 429;
            
            proxy_pass http://ssm_pay_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection "";
            proxy_redirect off;
            
            # Proxy buffering settings
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
            
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # No-cache for dynamic pages (let Next.js handle it)
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # -----------------------------------------------------------------
        # Custom Error Pages
        # -----------------------------------------------------------------
        error_page 400 /error/400.html;
        error_page 401 /error/401.html;
        error_page 403 /error/403.html;
        error_page 404 /error/404.html;
        error_page 429 /error/429.html;
        error_page 500 502 503 504 /error/50x.html;
        
        location ^~ /error/ {
            internal;
            root /usr/share/nginx/html;
        }
        
        # -----------------------------------------------------------------
        # Rate Limit Response
        # -----------------------------------------------------------------
        error_page 429 = @rate_limited;
        location @rate_limited {
            default_type application/json;
            return 429 '{"error": "Too many requests", "code": "RATE_LIMIT_EXCEEDED", "retry_after": 60}';
            add_header Retry-After "60";
            add_header Content-Type "application/json";
        }
    }

    # -------------------------------------------------------------------------
    # Monitoring/Grafana Server (Internal Access Only)
    # -------------------------------------------------------------------------
    server {
        listen 9091;
        server_name localhost;
        
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        deny all;
        
        location /stub_status {
            stub_status;
            access_log off;
        }
    }
}

