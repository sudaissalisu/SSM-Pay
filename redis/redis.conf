# =============================================================================
# SSM-Pay Payment Platform - Redis Configuration
# =============================================================================
# Production-optimized Redis configuration for payment platform caching,
# session management, and real-time data processing.
#
# This configuration focuses on:
# - Memory management and optimization
# - Data persistence (AOF + RDB hybrid)
# - Security hardening
# - Performance tuning for high-throughput scenarios
# =============================================================================

# -----------------------------------------------------------------------------
# Network Configuration
# -----------------------------------------------------------------------------

# Bind to all interfaces (Docker networking handles security)
bind 0.0.0.0

# Protected mode - disable in Docker (network isolation provides security)
protected-mode no

# Port configuration
port 6379

# TCP listen backlog (high value for high-traffic)
tcp-backlog 511

# Timeout for idle client connections (seconds)
# 0 means no timeout - keep connections alive
timeout 300

# TCP keepalive settings
tcp-keepalive 300

# -----------------------------------------------------------------------------
# General Server Settings
# -----------------------------------------------------------------------------

# Daemonize (must be 'no' for Docker)
daemonize no

# Process ID file location
pidfile /var/run/redis/redis.pid

# Log level: debug, verbose, notice, warning
loglevel notice

# Log file location
logfile /var/log/redis/redis.log

# Number of databases
databases 16

# Show logo at startup
always-show-logo no

# Set server name for identification
syslog-enabled no

# -----------------------------------------------------------------------------
# Memory Management
# -----------------------------------------------------------------------------

# Maximum memory allocation (adjust based on container limits)
maxmemory 256mb

# Eviction policy when maxmemory is reached:
# - allkeys-lru: Evict least recently used keys from any set
# - volatile-lru: Evict LRU keys with expiry set
# - allkeys-random: Random eviction of any keys
# - volatile-ttl: Evict keys with shortest TTL first
# - noeviction: Return errors when memory limit reached
maxmemory-policy allkeys-lru

# Sample size for LRU eviction algorithm (higher = more accurate but slower)
maxmemory-samples 5

# Lazy freeing of memory (non-blocking)
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

# Replication buffer lazy free
replica-lazy-flush yes

# -----------------------------------------------------------------------------
# Persistence - RDB Snapshots
# -----------------------------------------------------------------------------

# Save RDB snapshots at specified intervals:
# Format: save <seconds> <changes>
# Save if at least 1 key changed in 900 seconds (15 minutes)
save 900 1
# Save if at least 10 keys changed in 300 seconds (5 minutes)
save 300 10
# Save if at least 10000 keys changed in 60 seconds (1 minute)
save 60 10000

# Stop writes if snapshot fails (data integrity priority)
stop-writes-on-bgsave-error yes

# Enable RDB compression (LZF)
rdbcompression yes

# Add CRC64 checksum to RDB files
rdbchecksum yes

# RDB filename
rdbfilename dump.rdb

# Directory for RDB files
dir /data

# Enable RDB incremental FSYNC for better performance
rdb-save-incremental-fsync yes

# Coalesce write operations during child process
repl-diskless-sync-delay 5

# -----------------------------------------------------------------------------
# Persistence - AOF (Append Only File)
# -----------------------------------------------------------------------------

# Enable AOF persistence for better durability
appendonly yes

# AOF filename
appendfilename "appendonly.aof"

# AOF fsync policy:
# - always: Sync after every write (safest, slowest)
# - everysec: Sync every second (good balance) [RECOMMENDED]
# - no: Let OS handle syncing (fastest, less safe)
appendfsync everysec

# Rewrite AOF when it grows by percentage since last rewrite
auto-aof-rewrite-percentage 100

# Minimum AOF size to trigger rewrite (in MB)
auto-aof-rewrite-min-size 64mb

# Continue loading truncated AOF file
aof-load-truncated yes

# Use RDB preamble for faster AOF restarts
aof-use-rdb-preamble yes

# Multi-part AOF support (Redis 7+)
aof-timestamp-enabled yes

# -----------------------------------------------------------------------------
# Replication Settings
# -----------------------------------------------------------------------------

# Replica read-only mode
replica-read-only yes

# Replication is non-blocking on disk I/O
repl-diskless-sync yes

# Disconnect replicas after N seconds without acknowledgment
replica-lazy-flush yes

# Minimum replicas for write acceptance (for high availability)
# min-replicas-to-write 1
# min-replicas-max-lag 10

# -----------------------------------------------------------------------------
# Client Configuration
# -----------------------------------------------------------------------------

# Maximum number of connected clients
maxclients 10000

# Output buffer limits for normal clients
# Format: <hard> <soft> <soft_seconds>
client-output-buffer-limit normal 0 0 0

# Output buffer limits for replica clients
client-output-buffer-limit replica 256mb 64mb 60

# Output buffer limits for pub/sub clients
client-output-buffer-limit pubsub 32mb 8mb 60

# Maximum query time (milliseconds) before slow log entry
slowlog-log-slower-than 10000

# Maximum slow log entries
slowlog-max-length 128

# Client query buffer limit (in GB)
client-query-buffer-limit 1gb

# Maximum size of multi/exec element buffers
proto-max-bulk-len 512mb

# Hz value for background tasks (Redis background processing frequency)
hz 10

# Dynamic hz adjustment
dynamic-hz yes

# -----------------------------------------------------------------------------
# Security Settings
# -----------------------------------------------------------------------------

# Authentication password (set via environment variable in production)
# requirepass ${REDIS_PASSWORD}

# Disable dangerous commands or rename them
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command DEBUG ""
# rename-command CONFIG "CONFIG_b840fc02d524045429941cc15f59e41cb2be98c8"

# -----------------------------------------------------------------------------
# Performance Tuning
# -----------------------------------------------------------------------------

# Hash table sizing (will be auto-tuned by Redis)
hash-max-listpack-entries 512
hash-max-listpack-value 64

# List optimization settings
list-max-listpack-size -2
list-compress-depth 0

# Set optimization settings
set-max-intset-entries 512

# Sorted set optimization settings
zset-max-listpack-entries 128
zset-max-listpack-value 64

# HyperLogLog size
hll-sparse-max-bytes 3000

# Stream settings
stream-node-max-bytes 4096
stream-node-max-entries 100

# Active rehashing (1 = every 100ms CPU time)
activerehashing yes

# Client output buffer hard limit duration
client-output-buffer-limit-hard-limit-duration 60

# -----------------------------------------------------------------------------
# Advanced Configuration
# -----------------------------------------------------------------------------

# Actively defrag memory (Redis 4.0+)
# activedefrag yes
# active-defrag-ignore-bytes 100mb
# active-defrag-threshold-lower 10
# active-defrag-threshold-upper 100
# active-defrag-cycle-min 5
# active-defrag-cycle-max 75
# active-defrag-max-scan-fields 1000

# Local address binding for replication
# replica-announce-ip 1.2.3.4
# replica-announce-port 6379

# -----------------------------------------------------------------------------
# Monitoring & Metrics
# -----------------------------------------------------------------------------

# Enable command stats tracking for monitoring
# INFO commandstats will show usage statistics

# Latency monitoring
latency-monitor-threshold 100

# Notify keyspace events (useful for cache invalidation)
notify-keyspace-events ""

# -----------------------------------------------------------------------------
# TLS/SSL Configuration (Uncomment for production with SSL)
# -----------------------------------------------------------------------------
# tls-port 6380
# port 0
# tls-cert-file /etc/ssl/redis.crt
# tls-key-file /etc/ssl/redis.key
# tls-ca-cert-file /etc/ssl/ca.crt
# tls-auth-clients no
# tls-replication yes
