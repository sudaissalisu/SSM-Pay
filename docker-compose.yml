# =============================================================================
# SSM-Pay Docker Compose Configuration
# =============================================================================
# Production-ready Docker Compose setup for SSM-Pay payment platform
# Services: app (Next.js), redis (caching), optional monitoring
# =============================================================================

version: '3.8'

# -----------------------------------------------------------------------------
# Shared Networks
# -----------------------------------------------------------------------------
networks:
  ssmpay-network:
    driver: bridge
    name: ssmpay-network

# -----------------------------------------------------------------------------
# Shared Volumes
# -----------------------------------------------------------------------------
volumes:
  redis-data:
    driver: local
  sqlite-data:
    driver: local
  uploads-data:
    driver: local

# -----------------------------------------------------------------------------
# Services Definition
# -----------------------------------------------------------------------------
services:

  # ===========================================================================
  # Service: Main Application (SSM-Pay Next.js)
  # ===========================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-SSM-Pay}
        NODE_ENV: production
    container_name: ssmpay-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      # Application
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME:-SSM-Pay}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      
      # Database (SQLite)
      - DATABASE_URL=file:/app/data/ssmpay.db
      
      # Zainpay API
      - ZAINPAY_API_KEY=${ZAINPAY_API_KEY}
      - ZAINPAY_API_SECRET=${ZAINPAY_API_SECRET}
      - ZAINPAY_BASE_URL=${ZAINPAY_BASE_URL:-https://api.zainpay.ng/v1}
      - ZAINPAY_WEBHOOK_SECRET=${ZAINPAY_WEBHOOK_SECRET}
      
      # NextAuth
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      
      # Sentry
      - NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN}
      - SENTRY_AUTH_TOKEN=${SENTRY_AUTH_TOKEN}
      
      # Redis
      - REDIS_URL=redis://redis:6379
      - REDIS_PREFIX=${REDIS_PREFIX:-ssmpay:}
      
      # Security
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      - CSRF_SECRET=${CSRF_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      
      # ML Configuration
      - ML_FRAUD_THRESHOLD=${ML_FRAUD_THRESHOLD:-0.7}
      - ML_ANOMALY_SENSITIVITY=${ML_ANOMALY_SENSITIVITY:-2.5}
      - ENABLE_ML_FEATURES=${ENABLE_ML_FEATURES:-true}
      
      # Monitoring
      - METRICS_ENABLED=${METRICS_ENABLED:-true}
      - ALERT_EMAIL=${ALERT_EMAIL}
      
      # Feature Flags
      - ENABLE_WEBHOOK_RETRY=${ENABLE_WEBHOOK_RETRY:-true}
      - ENABLE_AUDIT_LOGGING=${ENABLE_AUDIT_LOGGING:-true}
    
    volumes:
      - sqlite-data:/app/data
      - uploads-data:/app/uploads
      - ./logs:/app/logs
    
    networks:
      - ssmpay-network
    
    depends_on:
      redis:
        condition: service_healthy
    
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ===========================================================================
  # Service: Redis (Caching & Session Storage)
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: ssmpay-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --maxmemory ${REDIS_MAX_MEMORY:-256mb}
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      --save 60 1000
      --requirepass ${REDIS_PASSWORD:-ssmpay_redis_dev_2024}
    volumes:
      - redis-data:/data
    networks:
      - ssmpay-network
    
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-ssmpay_redis_dev_2024}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # ===========================================================================
  # Optional Service: Redis Commander (Redis Management UI)
  # ===========================================================================
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: ssmpay-redis-ui
    restart: unless-stopped
    environment:
      - REDIS_HOSTS=local:redis:6379:0:${REDIS_PASSWORD:-ssmpay_redis_dev_2024}
      - HTTP_USER=${REDIS_UI_USER:-admin}
      - HTTP_PASSWORD=${REDIS_UI_PASSWORD:-admin123}
    ports:
      - "${REDIS_UI_PORT:-8081}:8081"
    networks:
      - ssmpay-network
    depends_on:
      redis:
        condition: service_healthy
    profiles:
      - monitoring
    deploy:
      resources:
        limits:
          memory: 128M

  # ===========================================================================
  # Optional Service: Dozzle (Container Log Viewer)
  # ===========================================================================
  dozzle:
    image: amir20/dozzle:latest
    container_name: ssmpay-dozzle
    restart: unless-stopped
    ports:
      - "${DOZZLE_PORT:-9999}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - DOZZLE_LEVEL=info
      - DOZZLE_AUTH_PROVIDER=simple
      - DOZZLE_SIMPLE_USERNAME=${DOZZLE_USER:-admin}
      - DOZZLE_SIMPLE_PASSWORD=${DOZZLE_PASSWORD:-admin123}
    networks:
      - ssmpay-network
    profiles:
      - monitoring
    deploy:
      resources:
        limits:
          memory: 64M

# =============================================================================
# Development Override Profile
# Use with: docker compose --profile development up
# =============================================================================
# To run in development mode, create a docker-compose.override.yml or use:
# docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# =============================================================================
